name: Deploy Clinic (clinic.kaana.in)

on:
  push:
    branches: [main]
    paths:
      - 'clinic-api/**'
      - 'clinic-crm/**'
      - 'cloudbuild.clinic.yaml'
      - '.github/workflows/deploy-clinic.yml'
  workflow_dispatch:

concurrency:
  group: deploy-clinic-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy clinic to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kaana-prod

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project kaana-prod \
            --config cloudbuild.clinic.yaml \
            --service-account=projects/kaana-prod/serviceAccounts/kaana-cloudbuild-deployer@kaana-prod.iam.gserviceaccount.com \
            .

      - name: Verify live site + API
        run: |
          UI_URL="$(gcloud run services describe kaana-clinic \
            --project kaana-prod \
            --region asia-south1 \
            --format='value(status.url)')"
          API_URL="$(gcloud run services describe clinic-api \
            --project kaana-prod \
            --region asia-south1 \
            --format='value(status.url)')"
          echo "Checking ${UI_URL}/"
          curl -fsS "${UI_URL}/" -o /dev/null
          echo "Checking ${API_URL}/api/health"
          curl -fsS "${API_URL}/api/health" -o /dev/null
          echo "Deploy OK: UI=${UI_URL}, API=${API_URL} (prod: https://clinic.kaana.in)"

