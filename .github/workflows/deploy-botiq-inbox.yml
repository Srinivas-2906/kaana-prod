name: Deploy BotIQ Inbox (inbox.kaana.in)

on:
  push:
    branches: [main]
    paths:
      - 'botiq/**'
      - 'cloudbuild.inbox.yaml'
      - '.github/workflows/deploy-botiq-inbox.yml'
  workflow_dispatch:

concurrency:
  group: deploy-inbox-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy inbox to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: crucial-accord-505607-g9
      GCP_WIF_PROVIDER: projects/888176696307/locations/global/workloadIdentityPools/github/providers/github-provider
      GCP_DEPLOYER_SA: kaana-cloudbuild-deployer@crucial-accord-505607-g9.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Submit Cloud Build (Inbox only)
        run: |
          gcloud builds submit \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --config cloudbuild.inbox.yaml \
            --service-account=projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/${{ env.GCP_DEPLOYER_SA }} \
            .

      - name: Verify live inbox host
        run: |
          HTML="$(curl -fsS "https://inbox.kaana.in/")"
          echo "$HTML" | grep -q 'BotIQ\|Log in to Kaana' || {
            echo "Expected Bot IQ inbox shell on inbox.kaana.in"
            exit 1
          }
          if echo "$HTML" | grep -q 'Try our AI in action'; then
            echo "Marketing homepage still served on inbox.kaana.in"
            exit 1
          fi
          echo "Deploy OK: https://inbox.kaana.in (Bot IQ Inbox SPA)"
