name: Deploy Kaana Tracker

on:
  push:
    branches: [main]
    paths:
      - 'kaana-tracker/**'
      - 'kaana-tracker-api/**'
      - 'cloudbuild.tracker.yaml'
      - '.github/workflows/deploy-tracker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tracker-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy tracker to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: crucial-accord-505607-g9
      GCP_WIF_PROVIDER: projects/888176696307/locations/global/workloadIdentityPools/github/providers/github-provider
      GCP_DEPLOYER_SA: kaana-cloudbuild-deployer@crucial-accord-505607-g9.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --config cloudbuild.tracker.yaml \
            --service-account=projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/${{ env.GCP_DEPLOYER_SA }} \
            .

      - name: Verify live site
        run: |
          URL="$(gcloud run services describe kaana-tracker \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region asia-south1 \
            --format='value(status.url)')"
          echo "Checking ${URL}/"
          curl -fsS "${URL}/" -o /dev/null
          curl -fsS "${URL}/api/health" -o /dev/null
          echo "Deploy OK: ${URL} (prod: https://tracker.kaana.in)"
