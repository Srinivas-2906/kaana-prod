steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:latest
      - ./botiq-whatsapp-server

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID"
        gcloud run deploy ${_API_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 3002 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 512Mi \
          --cpu 1 \
          --service-account ${_API_SERVICE_ACCOUNT} \
          --no-invoker-iam-check \
          --set-env-vars "NODE_ENV=production,DATABASE_PATH=/data/kaana.db,LITESTREAM_BUCKET=${_DB_BUCKET},PUBLIC_URL=${_PUBLIC_URL},LISTINGS_BASE_URL=${_LISTINGS_BASE_URL},WHATSAPP_PROVIDER=meta,META_API_VERSION=v22.0,KAANA_SELF_SERVE=false,KAANA_CONCIERGE_SPOTS=10,JWT_EXPIRES=7d,TYPING_DELAY_MS=350,KAANA_PLATFORM_URL=${_KAANA_PLATFORM_URL},KAANA_BOTIQ_URL=${_KAANA_BOTIQ_URL},KAANA_SITE_URL=https://kaana.in,META_APP_ID=27724398370520714" \
          --set-secrets "JWT_SECRET=${_SECRET_JWT}:latest,WHATSAPP_ACCESS_TOKEN=${_SECRET_WHATSAPP_TOKEN}:latest,WHATSAPP_PHONE_NUMBER_ID=${_SECRET_WHATSAPP_PHONE}:latest,WHATSAPP_VERIFY_TOKEN=${_SECRET_WHATSAPP_VERIFY}:latest,META_APP_SECRET=${_SECRET_META_APP}:latest,PLATFORM_ADMIN_EMAIL=${_SECRET_ADMIN_EMAIL}:latest,PLATFORM_ADMIN_PASSWORD=${_SECRET_ADMIN_PASSWORD}:latest"

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _API_SERVICE: kaana-api
  _PUBLIC_URL: https://api.kaana.in
  _LISTINGS_BASE_URL: https://api.kaana.in/listings
  _KAANA_PLATFORM_URL: https://app.kaana.in
  _KAANA_BOTIQ_URL: https://inbox.kaana.in
  _DB_BUCKET: crucial-accord-505607-g9-db
  _API_SERVICE_ACCOUNT: kaana-api-runner@crucial-accord-505607-g9.iam.gserviceaccount.com
  _SECRET_JWT: kaana-jwt-secret
  _SECRET_WHATSAPP_TOKEN: kaana-whatsapp-access-token
  _SECRET_WHATSAPP_PHONE: kaana-whatsapp-phone-id
  _SECRET_WHATSAPP_VERIFY: kaana-whatsapp-verify-token
  _SECRET_META_APP: kaana-meta-app-secret
  _SECRET_ADMIN_EMAIL: kaana-admin-email
  _SECRET_ADMIN_PASSWORD: kaana-admin-password

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:latest
