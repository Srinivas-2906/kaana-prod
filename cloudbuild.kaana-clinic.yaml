steps:
  # Standalone stack: clinic-api + clinic-crm (replaces kaana-clinic-only deploy)
  - id: build-clinic-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic-api:$BUILD_ID
      - ./clinic-api

  - id: push-clinic-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic-api:$BUILD_ID

  - id: deploy-clinic-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy "${_CLINIC_API_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic-api:$BUILD_ID" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080

  - id: build-clinic
    name: gcr.io/cloud-builders/docker
    waitFor: ['deploy-clinic-api']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID
      - --build-arg
      - VITE_CLINIC_API=${_VITE_CLINIC_API}
      - ./clinic-crm

  - id: push-clinic
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID

  - id: deploy-clinic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy "${_CLINIC_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _CLINIC_API_SERVICE: clinic-api
  _CLINIC_SERVICE: kaana-clinic
  _VITE_CLINIC_API: https://clinic-api.kaana.in/api

options:
  logging: CLOUD_LOGGING_ONLY
