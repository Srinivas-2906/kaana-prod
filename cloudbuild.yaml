steps:
  # ── Build & deploy marketing (kaana.in) ────────────────────────────────
  - id: build-marketing
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing:latest
      - ./kaana

  - id: push-marketing
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing

  - id: deploy-marketing
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing:$BUILD_ID"
        gcloud run deploy ${_MARKETING_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 512Mi \
          --cpu 1 \
          --set-env-vars "NEXT_PUBLIC_SITE_URL=https://kaana.in,GEMINI_MODEL=gemini-3.6-flash,GEMINI_DAILY_LIMIT=50,GEMINI_IP_WINDOW_LIMIT=3,GEMINI_IP_DAILY_LIMIT=8,GEMINI_IP_MIN_INTERVAL_MS=10000,GEMINI_CHAT_MAX_OUTPUT_TOKENS=2048,GEMINI_MAX_OUTPUT_TOKENS=2048" \
          --set-secrets "GEMINI_API_KEY=${_SECRET_GEMINI}:latest"

  # ── Build & deploy Platform (app.kaana.in) ─────────────────────────────
  - id: build-platform
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform:latest
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - --build-arg
      - VITE_BILLING_URL=${_VITE_BILLING_URL}
      - --build-arg
      - VITE_BOTIQ_URL=${_VITE_BOTIQ_URL}
      - --build-arg
      - VITE_CRM_URL=${_VITE_CRM_URL}
      - --build-arg
      - VITE_CLINIC_URL=${_VITE_CLINIC_URL}
      - --build-arg
      - VITE_LISTINGS_URL=${_VITE_LISTINGS_URL}
      - --build-arg
      - VITE_WHATSAPP_LINK=${_VITE_WHATSAPP_LINK}
      - --build-arg
      - VITE_WHATSAPP_API=${_VITE_WHATSAPP_API}
      - --build-arg
      - VITE_PLATFORM_URL=${_VITE_PLATFORM_URL}
      - ./kaana-platform

  - id: push-platform
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform

  - id: deploy-platform
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform:$BUILD_ID"
        gcloud run deploy ${_PLATFORM_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 256Mi \
          --cpu 1

  # ── Build & deploy BotIQ unified app (api.kaana.in + inbox.kaana.in) ───
  - id: build-botiq
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq:latest
      - --build-arg
      - VITE_WHATSAPP_API=/api
      - --build-arg
      - VITE_PLATFORM_URL=${_VITE_PLATFORM_URL}
      - ./botiq-app

  - id: push-botiq
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq

  - id: deploy-botiq
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq:$BUILD_ID"
        gcloud run deploy ${_API_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 3002 \
          --min-instances 0 \
          --max-instances 5 \
          --memory 512Mi \
          --cpu 1 \
          --service-account ${_API_SERVICE_ACCOUNT} \
          --set-env-vars "NODE_ENV=production,SERVE_CLIENT=true,PUBLIC_URL=${_PUBLIC_URL},LISTINGS_BASE_URL=${_LISTINGS_BASE_URL},WHATSAPP_PROVIDER=meta,META_API_VERSION=v21.0,KAANA_SELF_SERVE=false,KAANA_CONCIERGE_SPOTS=10,JWT_EXPIRES=7d,TYPING_DELAY_MS=350,KAANA_PLATFORM_URL=${_KAANA_PLATFORM_URL},KAANA_BOTIQ_URL=${_KAANA_BOTIQ_URL},BOTIQ_URL=${_KAANA_BOTIQ_URL}" \
          --set-secrets "DATABASE_URL=${_SECRET_DATABASE_URL}:latest,JWT_SECRET=${_SECRET_JWT}:latest,WHATSAPP_ACCESS_TOKEN=${_SECRET_WHATSAPP_TOKEN}:latest,WHATSAPP_PHONE_NUMBER_ID=${_SECRET_WHATSAPP_PHONE}:latest,WHATSAPP_VERIFY_TOKEN=${_SECRET_WHATSAPP_VERIFY}:latest,PLATFORM_ADMIN_EMAIL=${_SECRET_ADMIN_EMAIL}:latest,PLATFORM_ADMIN_PASSWORD=${_SECRET_ADMIN_PASSWORD}:latest"

  # ── Build & deploy CRM (crm.kaana.in) ──────────────────────────────────
  - id: build-crm
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm:latest
      - --build-arg
      - VITE_WHATSAPP_API=${_VITE_WHATSAPP_API}
      - --build-arg
      - VITE_PLATFORM_URL=${_VITE_PLATFORM_URL}
      - ./propcrm

  - id: push-crm
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm

  - id: deploy-crm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm:$BUILD_ID"
        gcloud run deploy ${_CRM_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 256Mi \
          --cpu 1

  # ── Build & deploy Clinic desk (clinic.kaana.in) ───────────────────────
  - id: build-clinic
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:latest
      - --build-arg
      - VITE_CLINIC_API=${_VITE_CLINIC_API}
      - --build-arg
      - VITE_TENANT_SLUG=dentacare
      - ./clinic-crm

  - id: push-clinic
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic

  - id: deploy-clinic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID"
        gcloud run deploy ${_CLINIC_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 256Mi \
          --cpu 1 \
          --set-env-vars "CLINIC_API_ORIGIN=$$(gcloud run services describe clinic-api --region ${_REGION} --format='value(status.url)')"

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana

  _MARKETING_SERVICE: kaana-web
  _PLATFORM_SERVICE: kaana-platform
  _CRM_SERVICE: kaana-crm
  _CLINIC_SERVICE: kaana-clinic
  _API_SERVICE: kaana-api

  # Public URLs
  _PUBLIC_URL: https://api.kaana.in
  _LISTINGS_BASE_URL: https://api.kaana.in/listings
  _KAANA_PLATFORM_URL: https://app.kaana.in
  _KAANA_BOTIQ_URL: https://inbox.kaana.in

  # Frontend build-time envs
  _VITE_API_URL: https://api.kaana.in/api/platform
  _VITE_BILLING_URL: https://api.kaana.in/api/billing
  _VITE_BOTIQ_URL: https://inbox.kaana.in
  _VITE_CRM_URL: https://crm.kaana.in
  _VITE_CLINIC_URL: https://clinic.kaana.in
  _VITE_LISTINGS_URL: https://api.kaana.in/listings
  _VITE_WHATSAPP_LINK: https://wa.me/91XXXXXXXXXX
  _VITE_WHATSAPP_API: https://api.kaana.in/api
  _VITE_CLINIC_API: /api
  _VITE_PLATFORM_URL: https://app.kaana.in

  # API runtime
  _API_SERVICE_ACCOUNT: kaana-api-runner@kaana-prod.iam.gserviceaccount.com

  # Secrets (Secret Manager)
  _SECRET_DATABASE_URL: kaana-database-url
  _SECRET_JWT: kaana-jwt-secret
  _SECRET_WHATSAPP_TOKEN: kaana-whatsapp-access-token
  _SECRET_WHATSAPP_PHONE: kaana-whatsapp-phone-id
  _SECRET_WHATSAPP_VERIFY: kaana-whatsapp-verify-token
  _SECRET_ADMIN_EMAIL: kaana-admin-email
  _SECRET_ADMIN_PASSWORD: kaana-admin-password
  _SECRET_GEMINI: kaana-gemini-api-key

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/marketing:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/platform:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/botiq:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/crm:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/clinic:latest
