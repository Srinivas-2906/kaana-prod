steps:
  # ── API (MySQL / Cloud SQL) ───────────────────────────────────────────
  - id: build-tracker-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api:latest
      - ./kaana-tracker-api

  - id: push-tracker-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api

  - id: deploy-tracker-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api:$BUILD_ID"
        printf 'NODE_ENV: production\nDB_NAME: %s\nDB_USER: %s\nDB_SOCKET: /cloudsql/%s\nCORS_ORIGIN: "https://kaanatracker.xyz,https://www.kaanatracker.xyz"\nTRACKER_PUBLIC_URL: https://kaanatracker.xyz\nGMAIL_ALLOWED_DOMAINS: kaana.in\nUPLOADS_DIR: /tmp/kaana-tracker-uploads\n' \
          "${_DB_NAME}" "${_DB_USER}" "${_CLOUDSQL_INSTANCE}" > /tmp/tracker-api-env.yaml
        gcloud run deploy "${_TRACKER_API_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --no-invoker-iam-check \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 512Mi \
          --cpu 1 \
          --add-cloudsql-instances "${_CLOUDSQL_INSTANCE}" \
          --set-secrets "DB_PASS=${_SECRET_DB_PASSWORD}:latest,JWT_SECRET=${_SECRET_JWT}:latest,GOOGLE_CLIENT_ID=${_SECRET_GOOGLE_CLIENT}:latest,RESEND_API_KEY=${_SECRET_RESEND}:latest,INVITE_FROM_EMAIL=${_SECRET_RESEND_FROM}:latest,GMAIL_SERVICE_ACCOUNT_JSON=${_SECRET_GMAIL_SA}:latest" \
          --env-vars-file /tmp/tracker-api-env.yaml

  # ── Frontend (kaanatracker.xyz via HTTPS load balancer) ─
  - id: read-google-client-id
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['deploy-tracker-api']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud secrets versions access latest --secret="${_SECRET_GOOGLE_CLIENT}" > /workspace/google_client_id.txt

  - id: build-tracker
    name: gcr.io/cloud-builders/docker
    waitFor: ['read-google-client-id']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        GOOGLE_ID=$$(tr -d '\r\n' < /workspace/google_client_id.txt)
        docker build \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker:latest \
          --build-arg VITE_TRACKER_API=/api \
          --build-arg VITE_GOOGLE_CLIENT_ID="$$GOOGLE_ID" \
          ./kaana-tracker

  - id: push-tracker
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker

  - id: deploy-tracker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker:$BUILD_ID"
        gcloud run deploy "${_TRACKER_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --no-invoker-iam-check \
          --port 8080 \
          --min-instances 0 \
          --max-instances 3 \
          --memory 256Mi \
          --cpu 1 \
          --set-env-vars "TRACKER_API_ORIGIN=$$(gcloud run services describe ${_TRACKER_API_SERVICE} --region ${_REGION} --format='value(status.url)')"

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _TRACKER_SERVICE: kaana-tracker
  _TRACKER_API_SERVICE: kaana-tracker-api
  _CLOUDSQL_INSTANCE: crucial-accord-505607-g9:asia-south1:kaana-tracker-mysql
  _DB_NAME: expense_tracker
  _DB_USER: tracker
  _SECRET_DB_PASSWORD: kaana-tracker-db-password
  _SECRET_JWT: kaana-jwt-secret
  _SECRET_RESEND: kaana-resend-api-key
  _SECRET_RESEND_FROM: kaana-resend-from
  _SECRET_GMAIL_SA: kaana-tracker-gmail-sa
  _SECRET_GOOGLE_CLIENT: kaana-tracker-google-client-id

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker-api:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/tracker:latest
