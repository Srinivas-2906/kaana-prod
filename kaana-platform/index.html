    <title>Bot IQ — WhatsApp automation</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('kaana-theme');
          var dark = p === 'light'
            ? false
            : p === 'dark'
              ? true
              : p === 'system'
                ? matchMedia('(prefers-color-scheme: dark)').matches
                : true;
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-product', 'botiq');
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#030303' : '#ffffff');
        } catch (e) {}
      })();
    </script>
